steps:
  # 1. Construir imagen
  - name: 'gcr.io/cloud-builders/docker'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        docker build \
          -f backend/services/${_SERVICE_NAME}/Dockerfile \
          -t ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_ARTIFACT_REGISTRY}/${_SERVICE_NAME}:${SHORT_SHA} \
          -t ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_ARTIFACT_REGISTRY}/${_SERVICE_NAME}:latest \
          backend/services/${_SERVICE_NAME}

  # 2. Subir imagen
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', '--all-tags', '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_ARTIFACT_REGISTRY}/${_SERVICE_NAME}']

  # 3. DESPLEGAR A CLOUD RUN (CON LAS VARIABLES CORRECTAS)
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - '${_SERVICE_NAME}'
      - '--image'
      - '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_ARTIFACT_REGISTRY}/${_SERVICE_NAME}:latest'
      - '--region'
      - '${_REGION}'
      - '--port'
      - '3000'
      # Conexión a Base de Datos (Socket Unix Seguro)
      - '--add-cloudsql-instances'
      - 'gen-lang-client-0059045498:us-east1:cafrilosa-db-master'
      # Variables de Entorno (AQUÍ ESTABA EL ERROR CORREGIDO)
      - '--set-env-vars'
      - 'NODE_ENV=production,DB_HOST=/cloudsql/gen-lang-client-0059045498:us-east1:cafrilosa-db-master,DB_PORT=5432,DB_USER=postgres,DB_NAME=cafrilosa_auth'
      # Secretos
      - '--set-secrets'
      - 'DB_PASSWORD=auth-service-db-password:latest,JWT_SECRET=cafrisales-jwt-secret:latest'

images:
  - '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_ARTIFACT_REGISTRY}/${_SERVICE_NAME}:latest'

options:
  logging: CLOUD_LOGGING_ONLY