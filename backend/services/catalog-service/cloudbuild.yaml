steps:
  # 1. Construir imagen (YA LO TIENES)
  - name: 'gcr.io/cloud-builders/docker'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        docker build \
          -f backend/services/${_SERVICE_NAME}/Dockerfile \
          -t ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_ARTIFACT_REGISTRY}/${_SERVICE_NAME}:${SHORT_SHA} \
          -t ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_ARTIFACT_REGISTRY}/${_SERVICE_NAME}:latest \
          backend/services/${_SERVICE_NAME}

  # 2. Subir imagen (YA LO TIENES)
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', '--all-tags', '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_ARTIFACT_REGISTRY}/${_SERVICE_NAME}']

# 🔥 3. DESPLEGAR A CLOUD RUN (CORREGIDO CON DB) 🔥
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - '${_SERVICE_NAME}'
      - '--image'
      - '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_ARTIFACT_REGISTRY}/${_SERVICE_NAME}:latest'
      - '--region'
      - '${_REGION}'
      - '--port'
      - '3000'
      - '--add-cloudsql-instances'  # <--- ESTO FALTABA
      - 'gen-lang-client-0059045498:us-east1:cafrilosa-db-master' # <--- TU BASE DE DATOS

images:
  - '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_ARTIFACT_REGISTRY}/${_SERVICE_NAME}:latest'

options:
  logging: CLOUD_LOGGING_ONLY