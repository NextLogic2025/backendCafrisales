swagger: '2.0'
info:
  title: Cafrilosa API Gateway
  description: Gateway unificado para los 8 microservicios de Cafrilosa
  version: 1.0.0
schemes:
  - https
produces:
  - application/json

# Definición de seguridad básica para evitar errores de validación de Google
securityDefinitions:
  api_key:
    type: "apiKey"
    name: "key"
    in: "query"

# Desactivamos seguridad por defecto (abierto) para que manejes auth en tus servicios
security: []

# ==================================================================
# RUTEO INTELIGENTE POR PREFIJO
# ==================================================================
paths:
  # 1. AUTH SERVICE (/auth/login, /auth/register...)
  # CAMBIO: Usamos /** en lugar de /{proxy+}
  /auth/**:
    post:
      x-google-backend:
        address: https://auth-service-6i2z4tjbba-ue.a.run.app
        path_translation: APPEND_PATH_TO_ADDRESS
      summary: Auth Service Endpoints
      operationId: authProxyPost
      responses:
        '200':
          description: OK
    get:
      x-google-backend:
        address: https://auth-service-6i2z4tjbba-ue.a.run.app
        path_translation: APPEND_PATH_TO_ADDRESS
      summary: Auth Service Endpoints
      operationId: authProxyGet
      responses:
        '200':
          description: OK
    options:
      operationId: authCors
      responses:
        '200':
          description: OK

  # 2. USER SERVICE
  /users/**:
    get:
      x-google-backend:
        address: https://user-service-6i2z4tjbba-ue.a.run.app
        path_translation: APPEND_PATH_TO_ADDRESS
      operationId: userGet
      responses: { '200': { description: OK } }
    post:
      x-google-backend:
        address: https://user-service-6i2z4tjbba-ue.a.run.app
        path_translation: APPEND_PATH_TO_ADDRESS
      operationId: userPost
      responses: { '200': { description: OK } }
    put:
      x-google-backend:
        address: https://user-service-6i2z4tjbba-ue.a.run.app
        path_translation: APPEND_PATH_TO_ADDRESS
      operationId: userPut
      responses: { '200': { description: OK } }
    patch:
      x-google-backend:
        address: https://user-service-6i2z4tjbba-ue.a.run.app
        path_translation: APPEND_PATH_TO_ADDRESS
      operationId: userPatch
      responses: { '200': { description: OK } }
    delete:
      x-google-backend:
        address: https://user-service-6i2z4tjbba-ue.a.run.app
        path_translation: APPEND_PATH_TO_ADDRESS
      operationId: userDelete
      responses: { '200': { description: OK } }
    options:
      operationId: userCors
      responses: { '200': { description: OK } }

  # 3. CATALOG SERVICE
  /catalog/**:
    get:
      x-google-backend:
        address: https://catalog-service-6i2z4tjbba-ue.a.run.app
        path_translation: APPEND_PATH_TO_ADDRESS
      operationId: catalogGet
      responses: { '200': { description: OK } }
    post:
      x-google-backend:
        address: https://catalog-service-6i2z4tjbba-ue.a.run.app
        path_translation: APPEND_PATH_TO_ADDRESS
      operationId: catalogPost
      responses: { '200': { description: OK } }
    put:
      x-google-backend:
        address: https://catalog-service-6i2z4tjbba-ue.a.run.app
        path_translation: APPEND_PATH_TO_ADDRESS
      operationId: catalogPut
      responses: { '200': { description: OK } }
    options:
      operationId: catalogCors
      responses: { '200': { description: OK } }

  # 4. ORDER SERVICE
  /orders/**:
    get:
      x-google-backend:
        address: https://order-service-6i2z4tjbba-ue.a.run.app
        path_translation: APPEND_PATH_TO_ADDRESS
      operationId: orderGet
      responses: { '200': { description: OK } }
    post:
      x-google-backend:
        address: https://order-service-6i2z4tjbba-ue.a.run.app
        path_translation: APPEND_PATH_TO_ADDRESS
      operationId: orderPost
      responses: { '200': { description: OK } }
    patch:
      x-google-backend:
        address: https://order-service-6i2z4tjbba-ue.a.run.app
        path_translation: APPEND_PATH_TO_ADDRESS
      operationId: orderPatch
      responses: { '200': { description: OK } }
    options:
      operationId: orderCors
      responses: { '200': { description: OK } }

  # 5. ZONE SERVICE
  /zones/**:
    get:
      x-google-backend:
        address: https://zone-service-6i2z4tjbba-ue.a.run.app
        path_translation: APPEND_PATH_TO_ADDRESS
      operationId: zoneGet
      responses: { '200': { description: OK } }
    post:
      x-google-backend:
        address: https://zone-service-6i2z4tjbba-ue.a.run.app
        path_translation: APPEND_PATH_TO_ADDRESS
      operationId: zonePost
      responses: { '200': { description: OK } }
    options:
      operationId: zoneCors
      responses: { '200': { description: OK } }

  # 6. CREDIT SERVICE
