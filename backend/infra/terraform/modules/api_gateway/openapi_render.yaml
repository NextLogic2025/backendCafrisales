      x-google-backend:
        address: https://credit-service-6i2z4tjbba-ue.a.run.app
        path_translation: APPEND_PATH_TO_ADDRESS
      operationId: creditGet
      responses: { '200': { description: OK } }
    post:
      x-google-backend:
        address: https://credit-service-6i2z4tjbba-ue.a.run.app
        path_translation: APPEND_PATH_TO_ADDRESS
      operationId: creditPost
      responses: { '200': { description: OK } }
    put:
      x-google-backend:
        address: https://credit-service-6i2z4tjbba-ue.a.run.app
        path_translation: APPEND_PATH_TO_ADDRESS
      operationId: creditPut
      responses: { '200': { description: OK } }
    options:
      operationId: creditCors
      responses: { '200': { description: OK } }

  # 7. ROUTE SERVICE
  /routes/**:
    get:
      x-google-backend:
        address: https://route-service-6i2z4tjbba-ue.a.run.app
        path_translation: APPEND_PATH_TO_ADDRESS
      operationId: routeGet
      responses: { '200': { description: OK } }
    post:
      x-google-backend:
        address: https://route-service-6i2z4tjbba-ue.a.run.app
        path_translation: APPEND_PATH_TO_ADDRESS
      operationId: routePost
      responses: { '200': { description: OK } }
    options:
      operationId: routeCors
      responses: { '200': { description: OK } }

  # 8. DELIVERY SERVICE
  /deliveries/**:
    get:
      x-google-backend:
        address: https://delivery-service-6i2z4tjbba-ue.a.run.app
        path_translation: APPEND_PATH_TO_ADDRESS
      operationId: deliveryGet
      responses: { '200': { description: OK } }
    post:
      x-google-backend:
        address: https://delivery-service-6i2z4tjbba-ue.a.run.app
        path_translation: APPEND_PATH_TO_ADDRESS
      operationId: deliveryPost
      responses: { '200': { description: OK } }
    put:
      x-google-backend:
        address: https://delivery-service-6i2z4tjbba-ue.a.run.app
        path_translation: APPEND_PATH_TO_ADDRESS
      operationId: deliveryPut
      responses: { '200': { description: OK } }
    options:
      operationId: deliveryCors
      responses: { '200': { description: OK } }

# ==================================================================
# CORS GLOBAL (Opción catch-all para OPTIONS en raíz o subrutas no definidas)
# ==================================================================
  /**:
    options:
      description: CORS Preflight
      operationId: corsGlobal
      x-google-backend:
        address: https://auth-service-6i2z4tjbba-ue.a.run.app 
        deadline: 1.0
      responses:
        '200':
          description: OK
          headers:
            Access-Control-Allow-Origin:
              type: string
              default: '*'
            Access-Control-Allow-Methods:
              type: string
              default: 'GET, POST, PUT, DELETE, PATCH, OPTIONS'
            Access-Control-Allow-Headers:
              type: string
              default: 'Authorization, Content-Type, X-Api-Key'