# ==================================================================
# CORS GLOBAL (Permitir acceso desde Web y Móvil)
# ==================================================================
  /api/v1/{proxy+}:
    options:
      description: CORS Preflight for /api/v1 routes
      operationId: corsApiV1Global
      x-google-backend:
        address: https://auth-service-6i2z4tjbba-ue.a.run.app
        deadline: 30.0
      responses:
        '200':
          description: OK
          headers:
            Access-Control-Allow-Origin:
              type: string
              default: '*'
            Access-Control-Allow-Methods:
              type: string
              default: 'GET, POST, PUT, DELETE, PATCH, OPTIONS'
            Access-Control-Allow-Headers:
              type: string
              default: 'Authorization, Content-Type, X-Api-Key, X-Service-Token'
            Access-Control-Allow-Credentials:
              type: string
              default: 'true'

  /{proxy+}:
    options:
      description: CORS Preflight
      operationId: corsGlobal
      x-google-backend:
        address: https://auth-service-6i2z4tjbba-ue.a.run.app
